<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FAF7F5">
<title>Подключение телефона · Фотопринт</title>
<link rel="stylesheet" href="/shared/fonts/fonts.css">
<link rel="stylesheet" href="/shared/glass.css">
<style>
  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 600; letter-spacing: -.025em; line-height: 1.1; }
  .lead { color: var(--ink3); font-size: 16px; max-width: 62ch; }
  .step { padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
  .step h2 { font-size: 19px; font-weight: 600; display: flex; align-items: center; gap: 12px; }
  .step h2 span { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font: 600 14px var(--mono); }
  .step p { color: var(--ink2); max-width: 66ch; }
  .seg { display: inline-flex; flex-wrap: wrap; padding: 3px; border-radius: 16px; background: var(--track); gap: 2px; align-self: flex-start; }
  .seg button { border: 0; background: transparent; min-height: 36px; padding: 0 14px; border-radius: 13px; font-size: 14px; color: var(--ink3); }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(60, 45, 35, .12); }
  .qrs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .qr { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .qr img { width: min(100%, 220px); aspect-ratio: 1; border-radius: 12px; background: #fff; }
  .qr b { font-size: 16px; }
  .qr a { font: 500 13px var(--mono); word-break: break-all; }
  .warn { padding: 12px 14px; border-radius: var(--r3); background: var(--warn-bg); color: var(--ink); font-size: 14.5px; }
  details { font-size: 14.5px; color: var(--ink2); }
  details summary { cursor: pointer; font-weight: 500; padding: 6px 0; }
  details ol { padding-left: 22px; list-style: decimal; display: grid; gap: 4px; margin-top: 4px; }
  .cols { display: grid; grid-template-columns: 240px 1fr; gap: 22px; align-items: start; }
  @media (max-width: 700px) { .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<main id="root"><h1>Подключение телефона</h1><p class="lead">Загрузка…</p></main>
<script>
(() => {
  'use strict';
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const qr = (title, url, note) => `<div class="glass-flat qr"><img src="/api/qr?text=${encodeURIComponent(url)}" alt="QR-код: ${esc(title)}" onerror="this.remove()">
    <b>${esc(title)}</b><a href="${esc(url)}">${esc(url)}</a>${note ? `<span class="faint" style="font-size:13px">${esc(note)}</span>` : ''}</div>`;
  let info = null, cur = 0;
  function draw() {
    const root = document.getElementById('root');
    const head = '<h1>Подключение телефона</h1>';
    if (!info.addresses.length) { root.innerHTML = head + '<p class="lead">Сервер не видит ни одной сети. Подключите компьютер к Wi-Fi или включите на нём точку доступа и обновите страницу.</p>'; return; }
    const a = info.addresses[Math.min(cur, info.addresses.length - 1)];
    const pick = info.addresses.length > 1 ? `<div class="seg" role="group" aria-label="Сеть">${info.addresses.map((x, i) => `<button data-i="${i}" aria-pressed="${i === cur}">${esc(x.ip)}${x.hotspot ? ' · точка доступа ноутбука' : ''}</button>`).join('')}</div>` : '';
    const lanWarn = info.lan ? '' : '<p class="warn">Сервер запущен только для этого компьютера — с телефона он не откроется. Запустите его для показа: <b>START-SHOW.bat</b> на ноутбуке или <b>./start.command --lan</b> на Mac.</p>';
    const httpsWarn = info.https ? '' : '<p class="warn">Защищённого соединения нет (не найден сертификат). Приложение и пульт на телефоне откроются, ответы голосом будут слышны, но <b>микрофон работать не будет</b>.</p>';
    const cert = info.https && info.ca ? `<section class="glass step"><h2><span>2</span>Один раз: установите сертификат</h2>
        <div class="cols">${qr('Сертификат', a.plain + '/ca.crt', 'нужен, чтобы телефон доверял ноутбуку')}
        <div><p>Без него телефон покажет предупреждение о небезопасном соединении. Сертификат действует только для этого показа; после хакатона его можно удалить там же, где ставили.</p>
          <details open><summary>iPhone</summary><ol><li>Наведите камеру на код и откройте ссылку в Safari, нажмите «Разрешить».</li><li>Настройки → «Профиль загружен» → «Установить».</li>
            <li>Настройки → Основные → Об этом устройстве → Доверие сертификатам → включите «Fotoprint demo root».</li></ol></details>
          <details><summary>Android</summary><ol><li>Откройте ссылку по коду и скачайте файл.</li><li>Настройки → Безопасность → Шифрование и учётные данные → Установить сертификат → Сертификат ЦС.</li>
            <li>Выберите скачанный файл «fotoprint-demo-ca.crt».</li></ol></details></div></div></section>` : '';
    const n = cert ? 3 : 2;
    root.innerHTML = `${head}<p class="lead">Ноутбук работает как сервер: модель, распознавание речи и голос остаются на нём, телефон только показывает экран.</p>${lanWarn}${httpsWarn}
      <section class="glass step"><h2><span>1</span>Подключите телефон к той же сети Wi-Fi</h2>
        <p>${a.hotspot ? 'Это сеть, которую раздаёт сам ноутбук («Мобильный хот-спот» Windows). Интернет телефону не нужен.' : 'Телефон и ноутбук должны быть в одной сети. Надёжнее всего включить на ноутбуке «Мобильный хот-спот» и подключить телефоны к нему — тогда показ не зависит от Wi-Fi площадки.'}</p>${pick}</section>
      ${cert}
      <section class="glass step"><h2><span>${n}</span>Откройте на телефоне</h2>
        <div class="qrs">${qr('Приложение picPac', a.base + '/t2/', 'заказ фото с телефона')}${qr('Пульт руководителя', a.base + '/t1/', 'показатели и помощник с голосом')}${qr('Помощник встреч', a.base + '/t3/', 'протоколы и документы')}</div></section>`;
  }
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) { cur = +b.dataset.i; draw(); } });
  fetch('/api/connect').then((r) => r.json()).then((d) => { info = d; draw(); })
    .catch(() => { document.getElementById('root').innerHTML = '<h1>Подключение телефона</h1><p class="lead">Сервер не отвечает. Запустите его и обновите страницу.</p>'; });
})();
</script>
</body>
</html>
