<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Помощник руководителя · Фотопринт</title>
<link rel="stylesheet" href="/shared/fonts/fonts.css">
<link rel="stylesheet" href="/shared/ui.css">
<link rel="stylesheet" href="/t3/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-dot">Ф</span>Фотопринт <small>Помощник руководителя · Трек 3</small></a>
  <span class="spacer"></span>
  <span class="chip" id="aiChip" title="Где сейчас думает помощник"><span class="dot"></span><span>Проверяю ИИ…</span></span>
  <label class="role-pick">
    <span class="faint">Роль</span>
    <select class="select" id="role" aria-label="Роль пользователя">
      <option value="director">Директор</option>
      <option value="production">Начальник цеха</option>
      <option value="salons">Управляющая салонами</option>
      <option value="employee">Сотрудник</option>
    </select>
  </label>
</header>

<nav class="t3-nav" aria-label="Разделы">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="meetings">Встречи</button>
    <button class="tab" role="tab" data-tab="docs">Документы</button>
    <button class="tab" role="tab" data-tab="tasks">Задачи</button>
    <button class="tab" role="tab" data-tab="summary">Итоги</button>
    <button class="tab" role="tab" data-tab="security">Защита</button>
  </div>
  <span class="demo-badge">Демо-компания «Проявка» · данные выдуманы</span>
</nav>

<main id="app" class="t3-main"></main>

<script src="/shared/company.js"></script>
<script src="/shared/api.js"></script>
<script src="/t3/docs.js"></script>
<script src="/t3/app.js"></script>
</body>
</html>
