<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>picPac · экран производства</title>
<link rel="stylesheet" href="/shared/fonts/fonts.css">
<link rel="stylesheet" href="/shared/ui.css">
<style>
  body { background: var(--canvas); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; display: flex; flex-direction: column; gap: 14px; }
  .wrap h1 { font-size: 24px; font-weight: 600; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .ord { display: flex; flex-direction: column; gap: 10px; }
  .ord .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .ord b { font-size: 17px; }
  .ord small { color: var(--ink2); display: block; font-size: 14px; }
  .form { display: flex; flex-direction: column; gap: 10px; max-width: 360px; }
  .btn { min-height: 48px; }
  .err { color: var(--bad); font-size: 14px; }
  .btn-bad { color: var(--bad); }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script src="/shared/api.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  let S = { tok: sessionStorage.getItem('pp_staff'), user: null, data: null, err: '', filter: 'mine' };
  const NAME = { accepted: 'Принят', moderation: 'Модерация', production: 'Производство', quality: 'Контроль качества', shipped: 'Передан в доставку', done: 'Завершён' };
  const STATE = { pending: 'ждёт', started: 'в работе', defect: 'брак', passed: 'сдан' };

  async function call(method, path, body) {
    const r = await fetch(path, { method, headers: Object.assign({ 'Content-Type': 'application/json' }, S.tok ? { Authorization: 'Bearer ' + S.tok } : {}), body: body ? JSON.stringify(body) : undefined });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(d.error || 'Ошибка ' + r.status), { status: r.status });
    return d;
  }
  async function load() {
    try { S.data = await call('GET', '/api/app/staff/orders'); S.user = S.user || await call('GET', '/api/me'); S.err = ''; }
    catch (e) { if (e.status === 401) { S.tok = null; sessionStorage.removeItem('pp_staff'); } S.err = e.message; S.data = null; }
    draw();
  }
  function draw() {
    const a = $('#app');
    if (!S.tok || !S.data) {
      a.innerHTML = `<h1>Экран производства</h1><p class="muted">Войдите под учётной записью сотрудника (operator или quality).</p>
        <form class="form" id="f"><div><label for="lg">Логин</label><input class="input" id="lg" value="operator" autocomplete="username"></div>
        <div><label for="pw">Пароль</label><input class="input" id="pw" type="password" placeholder="demo2026" autocomplete="current-password"></div>
        ${S.err ? `<p class="err" role="alert">${esc(S.err)}</p>` : ''}<button class="btn btn-primary btn-lg" type="submit">Войти</button></form>
        <a href="/t2/" class="btn btn-ghost" style="align-self:flex-start">← Приложение клиента</a>`;
      $('#f').onsubmit = async (e) => {
        e.preventDefault();
        try { const d = await call('POST', '/api/login', { login: $('#lg').value.trim(), password: $('#pw').value }); S.tok = d.token; S.user = d.user; sessionStorage.setItem('pp_staff', d.token); load(); }
        catch (er) { S.err = er.message; draw(); }
      };
      return;
    }
    const D = S.data, mine = D.orders.filter((o) => o.can), list = S.filter === 'mine' ? mine : D.orders;
    a.innerHTML = `<div class="row" style="justify-content:space-between"><h1>Очередь: ${D.stages.map((s) => NAME[s]).join(', ') || 'просмотр'}</h1><button class="btn btn-ghost" id="out">Выйти</button></div>
      <p class="muted">${esc(S.user.name)} · ${esc(S.user.title)}</p>
      <div class="row"><button class="chip" data-f="mine" aria-pressed="${S.filter === 'mine'}">Мои этапы · ${mine.length}</button><button class="chip" data-f="all" aria-pressed="${S.filter === 'all'}">Все · ${D.orders.length}</button></div>
      ${S.err ? `<p class="err" role="alert">${esc(S.err)}</p>` : ''}
      ${list.map((o) => `<div class="card ord"><div class="top"><div><b>${esc(o.number)}</b><small>${(o.items || []).map((i) => esc(i.name) + ' × ' + i.qty).join(', ')} · ${o.photos} фото</small><small>${esc(o.pickup_point ? o.pickup_point.name : (o.delivery || {}).name || '')}</small></div>
        <div style="text-align:right"><span class="chip chip-accent">${NAME[o.stage]}</span><small>${STATE[o.stage_status] || ''}</small></div></div>
        ${o.can ? `<div class="row"><button class="btn btn-primary" data-a="accept" data-id="${o.id}" ${o.stage_status === 'started' ? 'disabled' : ''}>Принял</button><button class="btn" data-a="handoff" data-id="${o.id}" ${o.stage_status !== 'started' ? 'disabled' : ''}>Сдал</button><button class="btn btn-bad" data-a="defect" data-id="${o.id}">Брак</button></div>` : '<small>Этот этап вам отмечать нельзя</small>'}</div>`).join('') || '<div class="card"><p class="muted">Заказов в очереди нет.</p></div>'}`;
    $('#out').onclick = () => { S.tok = null; S.data = null; S.user = null; sessionStorage.removeItem('pp_staff'); draw(); };
    a.querySelectorAll('[data-f]').forEach((b) => { b.onclick = () => { S.filter = b.dataset.f; draw(); }; });
    a.querySelectorAll('[data-a]').forEach((b) => {
      b.onclick = async () => {
        try { await call('POST', '/api/app/staff/orders/' + b.dataset.id + '/mark', { action: b.dataset.a }); toast('Отмечено'); } catch (e) { S.err = e.message; }
        load();
      };
    });
  }
  load(); setInterval(() => { if (S.tok) load(); }, 5000);
})();
</script>
</body>
</html>
