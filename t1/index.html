<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пульт руководителя · Фотопринт</title>
<link rel="stylesheet" href="/shared/fonts/fonts.css">
<link rel="stylesheet" href="/shared/ui.css">
<link rel="stylesheet" href="/t1/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" title="К трём трекам"><span class="brand-dot">Ф</span>Пульт причин</a>
  <span class="chip period">Октябрь 2026</span>
  <div class="tabs" role="tablist" aria-label="С чем сравнивать">
    <button class="tab" role="tab" aria-selected="true" data-mode="plan">к плану</button>
    <button class="tab" role="tab" aria-selected="false" data-mode="prev">к сентябрю</button>
  </div>
  <span class="spacer"></span>
  <span class="demo-badge hide-sm">Демо-компания «Проявка» · данные выдуманы</span>
  <span class="chip" id="ai-status"><span class="dot"></span>ИИ…</span>
</header>

<main class="wrap">
  <!-- главное за месяц -->
  <section class="hero card" aria-labelledby="hero-title">
    <div class="hero-main">
      <p class="eyebrow" id="hero-title">Главное за месяц · прибыль</p>
      <div class="hero-num"><span class="num" id="hero-value">—</span><span class="chip chip-bad" id="hero-delta">—</span></div>
      <p class="hero-text" id="hero-text"></p>
      <button class="btn btn-primary" id="hero-go">Найти причину →</button>
    </div>
    <div class="hero-roots">
      <p class="eyebrow">Три корня отклонения</p>
      <ul id="hero-roots"></ul>
    </div>
  </section>

  <!-- четыре блока показателей -->
  <section class="blocks" id="blocks" aria-label="Показатели"></section>

  <!-- векторный анализ + журнал решений -->
  <section class="lower">
    <article class="card vector" id="vector" aria-labelledby="vector-title"></article>
    <article class="card journal" aria-labelledby="journal-title">
      <div class="row between">
        <div>
          <p class="eyebrow">Решения по отклонениям</p>
          <h2 class="h2" id="journal-title">Журнал решений</h2>
        </div>
        <span class="faint small" id="journal-count"></span>
      </div>
      <div id="journal"></div>
    </article>
  </section>
</main>

<!-- провал до причины -->
<div class="drawer-back hidden" id="drawer-back"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="node-title" role="dialog">
  <div class="drawer-head">
    <button class="btn btn-sm btn-ghost" id="back" aria-label="Шаг назад">← Назад</button>
    <nav class="crumbs" id="crumbs" aria-label="Путь к причине"></nav>
    <button class="btn btn-sm btn-ghost close" id="close" aria-label="Закрыть">✕</button>
  </div>
  <div class="drawer-body" id="node"></div>
</aside>

<!-- решение -->
<div class="modal-back hidden" id="modal-back">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal"></div>
</div>

<!-- бланк для печати -->
<div id="print-sheet" class="print-sheet"></div>

<script src="/shared/company.js"></script>
<script src="/shared/api.js"></script>
<script src="/t1/app.js"></script>
</body>
</html>
